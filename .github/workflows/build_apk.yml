name: Build Try1 UV Sensor APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Regenerate Fresh Android Gradle Wrapper & Build Release APK
        working-directory: ./mobile_app
        run: |
          rm -rf android
          flutter create --platforms=android --org com.ntust.uvmonitor .
          # Add INTERNET & network permissions to AndroidManifest.xml
          sed -i 's/<application/<uses-permission android:name="android.permission.INTERNET"\/><uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"\/><application android:usesCleartextTraffic="true"/g' android/app/src/main/AndroidManifest.xml
          cp ../app1.dart lib/main.dart
          flutter pub get
          flutter build apk --release -t lib/main.dart --android-skip-build-dependency-validation

      - name: Upload Compiled APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Try1-UV-Monitor-APK
          path: mobile_app/build/app/outputs/flutter-apk/app-release.apk